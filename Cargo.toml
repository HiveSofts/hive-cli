[package]
name = "hive-cli"
version = "0.1.0"
edition = "2021"
authors = ["HiveSofts"]
description = "Hive CLI - Developer workflow automation tool"
license = "MIT"
repository = "https://github.com/HiveSofts/hive-cli"

[[bin]]
name = "hive"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.39", features = ["derive", "color"] }
clap_complete = "4.5.54"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.140"
indexmap = { version = "2.9.0", features = ["serde"] }
thiserror = "2.0.12"
anyhow = "1.0.98"
colored = "3.0.0"
indicatif = "0.17.11"
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
dialoguer = "0.11.0"
tokio = { version = "1.45.1", features = ["full"] }
dirs = "6.0.0"
which = "7.0.2"
fs_extra = "1.3.0"
regex = "1.11.1"
once_cell = "1.21.3"
ctrlc = { version = "3.4.6", features = ["termination"] }
walkdir = "2.5.0"
tempfile = "3.20.0"
dotenvy = "0.15.7"
shell-words = "1.1.0"
open = "5.3.2"
console = "0.15.11"