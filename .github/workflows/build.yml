name: Build Hive CLI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:
  build:

    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: hive

          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-gnu
            binary: hive.exe


    runs-on: ${{ matrix.os }}


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}


      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2


      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}


      - name: Create artifact directory
        shell: bash
        run: mkdir -p dist


      - name: Copy Linux binary
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/hive-linux


      - name: Copy Windows binary
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/hive-windows.exe


      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hive-${{ matrix.name }}
          path: dist/
          retention-days: 7