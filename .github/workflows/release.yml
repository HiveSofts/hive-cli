name: Release Hive CLI

on:
  push:
    tags:
      - "v*"


permissions:
  contents: write


jobs:
  build-release:

    name: Build Release (${{ matrix.name }})

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: hive
            output: hive-linux


          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-gnu
            binary: hive.exe
            output: hive-windows.exe


    runs-on: ${{ matrix.os }}


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}


      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2


      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}


      - name: Prepare Linux binary
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.output }}


      - name: Prepare Windows binary
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.output }}


      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hive-${{ matrix.name }}
          path: dist/


  create-release:

    name: Create GitHub Release

    needs: build-release

    runs-on: ubuntu-latest


    steps:

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files


      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}